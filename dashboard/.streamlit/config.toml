# Configuração do Streamlit para o site publicado (Streamlit Community Cloud).
# O Docker local usa dashboard/.streamlit/config.toml.

[server]
headless = true
# No Community Cloud o código só muda com push (o app reinicia sozinho),
# então não há arquivo para vigiar: "none" evita o custo do polling.
runOnSave = false
fileWatcherType = "none"

[client]
# Esconde o botão "Deploy" e o menu de desenvolvimento
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[theme]
# Cores dos slides do mapeamento (as fontes Poppins e Inter vêm de estilo.py)
base = "light"
primaryColor = "#2B6CB0"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7FAFC"
textColor = "#2D3748"
